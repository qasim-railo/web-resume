<main class="birthday-page">
  <div class="floating-shapes" aria-hidden="true">
    <span class="shape shape-one">🎉</span>
    <span class="shape shape-two">✨</span>
    <span class="shape shape-three">🎂</span>
    <span class="shape shape-four">💖</span>
  </div>

  <section class="lock-card" *ngIf="!isUnlocked">
    <div class="lock-badge">Gift Locked</div>
    <h2>Enter 4-digit code</h2>
    <div class="code-input-row">
      <input
        type="password"
        maxlength="4"
        inputmode="numeric"
        [(ngModel)]="enteredCode"
        placeholder="****"
      />
    </div>
    <button type="button" class="unlock-btn" (click)="unlockGift()">Open Gift</button>
    <p class="error-message" *ngIf="isIncorrect">Incorrect code. Please try again.</p>
  </section>

  <section class="birthday-card" *ngIf="isUnlocked" aria-live="polite">
    <div class="badge">Happy Birthday</div>

    <div class="photo-wrap">
      <img [src]="imageData || 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80'" [alt]="personName + ' birthday photo'" />
    </div>

    <h1>Happy Birthday, <span>{{ personName }}</span>!</h1>

    <p class="message">
      {{ birthdayMessage }}
    </p>

    <div class="sparkle-row" aria-label="Birthday wishes">
      <span>🎈</span>
      <span>🎁</span>
      <span>💫</span>
      <span>🎊</span>
    </div>
  </section>
</main>
